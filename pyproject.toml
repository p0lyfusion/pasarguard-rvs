[project]
name = "pasarguard-rvs"
version = "0.1.0"
description = "Shells through Pasarguard reverse-tunnel devices"
requires-python = ">=3.14"  # same as the panel; annotations rely on PEP 649
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "InquirerPy>=0.3.4",
    # Must match the panel's uv.lock: the image regenerates the bridge stubs from proto/service.proto
    # (copied from the panel), so a newer bridge (e.g. 0.10.0, which expects Mtproto) breaks at import.
    "pasarguard-node-bridge==0.9.4",
]

[project.scripts]
rvs = "pasarguard_rvs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Same style as the panel repo this code came from.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.ruff.lint.isort]
combine-as-imports = true
